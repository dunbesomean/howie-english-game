<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Word Explorer</title>
<!--
  WORD EXPLORER v6 - single-file offline English app for Howie and Alisa.
  Works on iPad, iPhone, and desktop/laptop (mouse + keyboard: 1/2/3 to answer,
  Space to replay audio, Enter to continue, Escape to close).
  "Add to Home Screen" makes it open full-screen like a real app.

  THREE SEPARATE GAMES, 10 questions per round:
    1. Phonics (45 sets) - word families, beginning sounds, ending sounds,
                           middle vowels, blends & digraphs
    2. Make a Sentence (20 sets) - only the exact words needed, no extra tiles
    3. Fill the Blank (20 sets)  - choose the missing word

  PHONICS AUDIO: speech engines read a bare letter as its NAME ("f" -> "eff",
  "a" -> "ay"), which teaches the wrong thing. Every sound is therefore spoken
  using tested phoneme spellings (see SOUND_SAY / RIME_SAY / VOWEL_ANCHOR) and
  anchored in a word, the way HK P1 teachers say it: "fuh, as in fan".
  Letters are always SHOWN on screen; only the audio uses these spellings.

  English only. Progress for both children is stored separately and every set
  can be replayed. Reading voice is changeable in Menu (devices differ).

  NOTE: localStorage does not persist inside the claude.ai preview sandbox.
  Use Menu -> Export progress to back up, and Import progress to restore.
-->
<style>
:root{
  --font:'Chalkboard SE','Comic Sans MS','Trebuchet MS','Segoe UI',sans-serif;
  --shadow:0 10px 28px rgba(20,30,50,.14);
  --shadow-sm:0 4px 10px rgba(20,30,50,.10);
  --bg-top:#EAF2F8; --bg-bot:#D7E7F2; --surface:#fff;
  --ink:#1B2A4A; --ink-soft:#6B7A8F;
  --primary:#4A7FB5; --primary-ink:#fff; --secondary:#8FD3C7;
  --success:#1E8E5A; --success-bg:#E4F6EC; --warn:#FFF3CD;
  --line:rgba(0,0,0,.08);
}
[data-theme="train"]{
  --bg-top:#EDF3FA; --bg-bot:#D3E1EE;
  --ink:#1B2A4A; --ink-soft:#5A6B8C;
  --primary:#E2231A; --secondary:#FFC20E; --success:#1E8E5A;
}
[data-theme="animal"]{
  --bg-top:#FFF2F8; --bg-bot:#FBE3EF;
  --ink:#4A3350; --ink-soft:#8A7093;
  --primary:#FF6FA0; --secondary:#B892FF; --success:#3E9E76;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);
  background:linear-gradient(180deg,var(--bg-top),var(--bg-bot) 75%);
  background-attachment:fixed;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;
  display:flex;justify-content:center}
#app{width:100%;max-width:1024px;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
svg.icon{display:block;width:100%;height:100%}
svg.icon.sm{width:22px;height:22px;display:inline-block;vertical-align:middle}
svg.icon.lg{width:52px;height:52px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;padding:12px 18px 6px;
  background:linear-gradient(180deg,var(--bg-top),rgba(255,255,255,0));backdrop-filter:blur(4px)}
.topRow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topTitle{font-weight:bold;font-size:19px;flex:1;text-align:center}
.iconBtn{width:48px;height:48px;border-radius:50%;border:none;background:var(--surface);
  box-shadow:var(--shadow-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:12px}
.iconBtn:active{transform:scale(.94)}

/* ---------- layout ---------- */
.screen{flex:1;display:flex;flex-direction:column;padding:8px 22px 32px;gap:16px}
.center{align-items:center;justify-content:center;text-align:center}
.center-text{text-align:center}
h1{font-size:30px;margin:6px 0}
h2{font-size:22px;margin:4px 0}
.bigTitle{font-size:40px;letter-spacing:.5px}
p.sub,.sub{color:var(--ink-soft);font-size:15px;margin:0}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px}

/* ---------- buttons ---------- */
.btn{min-height:60px;border-radius:18px;border:none;font-family:var(--font);font-size:19px;
  font-weight:bold;cursor:pointer;padding:12px 24px;display:flex;align-items:center;
  justify-content:center;gap:10px;box-shadow:var(--shadow-sm);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-secondary{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn-success{background:var(--success);color:#fff}
.btn-wide{width:100%}
.btn.small{min-height:46px;font-size:16px;padding:8px 18px;align-self:center}
.btnRow{display:flex;gap:12px;width:100%}
.btnRow .btn{flex:1}

/* ---------- profile picker ---------- */
.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:100%;max-width:620px;margin-top:10px}
.profileCard{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:22px 14px;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:4px solid transparent}
.profileCard svg{width:150px;height:120px}
.profileCard:active{transform:scale(.97)}
.profileCard.little{border-color:#E2231A33}
.profileCard.big{border-color:#FF6FA033}
.pName{font-weight:bold;font-size:19px}
.pZh{font-size:16px;color:var(--ink-soft)}

/* ---------- home ---------- */
.mascotBanner{display:flex;align-items:center;gap:16px;background:var(--surface);
  border-radius:24px;box-shadow:var(--shadow);padding:16px 20px}
.mascotBanner svg{width:110px;height:86px;flex:0 0 auto}
.bannerBig{font-size:24px;font-weight:bold}
.gameCard{display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:24px;
  box-shadow:var(--shadow);padding:20px;cursor:pointer;border-left:10px solid var(--primary)}
.gameCard:active{transform:scale(.985)}
.gameCard.sentence{border-left-color:var(--secondary)}
.gameCard.fill{border-left-color:var(--success)}
.gameIcon{width:60px;height:60px;flex:0 0 auto;background:var(--bg-bot);border-radius:18px;padding:12px}
.gameText{flex:1}
.gameName{font-size:22px;font-weight:bold}
.gameName .zh{font-size:16px;color:var(--ink-soft);font-weight:normal}
.gameHint{font-size:15px;color:var(--ink-soft)}
.gameMeta{font-size:13px;color:var(--ink-soft);margin-top:4px}
.gameGo{font-size:26px;color:var(--primary)}

/* ---------- set grid ---------- */
.setGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.setCard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-sm);padding:14px 12px;
  cursor:pointer;text-align:center;border:3px solid transparent;position:relative}
.setCard.played{border-color:var(--success-bg)}
.setCard:active{transform:scale(.96)}
.setNum{position:absolute;top:8px;left:12px;font-size:13px;color:var(--ink-soft);font-weight:bold}
.setName{font-size:17px;font-weight:bold;margin:14px 0 8px;min-height:42px;display:flex;
  align-items:center;justify-content:center}
.setStars{display:flex;gap:3px;justify-content:center}
.setStars svg{width:20px;height:20px}
.setBest{font-size:12px;color:var(--ink-soft);margin-top:6px}
.setBest.new{color:var(--primary);font-weight:bold}

/* ---------- journey strip ---------- */
.journeyWrap{padding:4px 22px 0}
.jHead{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.jLine{width:22px;height:7px;border-radius:4px;flex:0 0 auto}
.jName{font-weight:bold}
.jNow{margin-left:auto;display:flex;align-items:center;gap:5px;font-weight:bold;color:var(--ink)}
.jTrack{position:relative;height:14px;border-radius:10px;background:rgba(0,0,0,.09);margin:22px 26px 30px}
.jFill{position:absolute;left:0;top:0;height:100%;border-radius:10px;transition:width 1.6s cubic-bezier(.4,0,.2,1)}
.jStop{position:absolute;top:50%;transform:translate(-50%,-50%)}
.jDot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid rgba(0,0,0,.15)}
.jStop.reached .jDot{border-color:rgba(0,0,0,.25)}
.jMascot{position:absolute;top:-26px;transform:translateX(-50%);width:64px;height:52px;
  transition:left 1.6s cubic-bezier(.4,0,.2,1)}
.jMascot svg{width:100%;height:100%}
.jMascot.moving{animation:bobAlong 1.6s ease-in-out}
@keyframes bobAlong{0%,100%{transform:translateX(-50%) translateY(0)}
  25%{transform:translateX(-50%) translateY(-7px)}75%{transform:translateX(-50%) translateY(-4px)}}

/* ---------- travel interstitial ---------- */
.travelScreen{gap:10px}
.travelStage{position:relative;width:100%;height:150px;overflow:hidden}
.travelMascot{position:absolute;bottom:26px;width:150px;height:120px;animation:crossScreen 2.1s ease-in-out}
.travelMascot svg{width:100%;height:100%}
@keyframes crossScreen{
  0%{left:-160px;opacity:0}15%{opacity:1}
  85%{opacity:1}100%{left:100%;opacity:0}}
.travelGround{position:absolute;bottom:0;left:0;right:0;height:14px}
[data-theme="train"] .travelGround{background:repeating-linear-gradient(90deg,#38598B,#38598B 16px,transparent 16px,transparent 30px);border-top:5px solid #8B99AC}
[data-theme="animal"] .travelGround{background:#8ED1B4;border-radius:40px 40px 0 0;height:22px}
.travelLabel{font-size:15px;color:var(--ink-soft);letter-spacing:2px;text-transform:uppercase}
.travelStop{font-size:32px;margin:0}

/* ---------- question cards ---------- */
.qCard{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:26px 22px;
  display:flex;flex-direction:column;align-items:center;gap:18px}
.qCard.phonicsCard{border:4px solid var(--secondary)}
.qCard.fillCard{border:4px dashed var(--success)}
.qCard.sentCard{border:4px solid var(--primary)}
.qLabel{font-size:19px;font-weight:bold;text-align:center}
.picRound{width:150px;height:150px;background:var(--bg-top);border-radius:50%;padding:22px;box-shadow:var(--shadow-sm)}
.picRound.sm{width:78px;height:78px;padding:10px}
.speakBtn{background:var(--secondary);border:none;border-radius:50%;width:74px;height:74px;padding:20px;
  box-shadow:var(--shadow-sm);cursor:pointer;position:relative}
.speakBtn.big{width:104px;height:104px;padding:28px}
.speakBtn:active{transform:scale(.93)}
.speakBtn::after{content:'';position:absolute;inset:-8px;border-radius:50%;
  border:3px solid var(--secondary);opacity:.55;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.35);opacity:0}}

/* onset + rime slots */
.wordSlots{display:flex;gap:12px;align-items:center}
.slot{min-width:92px;height:96px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:46px;font-weight:bold}
.onsetSlot{border:5px dashed var(--primary);color:var(--ink-soft);background:var(--bg-top)}
.onsetSlot.filled{border-style:solid;background:var(--success-bg);color:var(--success);
  animation:snapIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes snapIn{0%{transform:scale(.4) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
.rimeSlot{background:var(--primary);color:#fff;padding:0 18px}

/* phonics bubbles */
.bubbleRow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.bubble{width:104px;height:104px;border-radius:50%;border:4px solid rgba(255,255,255,.9);
  background:radial-gradient(circle at 32% 28%,#fff,var(--secondary));
  font-family:var(--font);font-size:38px;font-weight:bold;color:var(--ink);cursor:pointer;
  box-shadow:0 8px 20px rgba(20,30,50,.18), inset 0 -8px 14px rgba(0,0,0,.06);
  animation:float 3.2s ease-in-out infinite}
.bubble:nth-child(2){animation-delay:.5s}
.bubble:nth-child(3){animation-delay:1s}
.bubble:active{transform:scale(.9)}
.bubble.chosen{background:radial-gradient(circle at 32% 28%,#fff,#9BE7C4);border-color:var(--success)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* word buttons */
.wordRow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.wordBtn{flex:1 1 140px;min-height:84px;border-radius:20px;border:3px solid var(--line);
  background:var(--bg-top);font-family:var(--font);font-size:30px;font-weight:bold;color:var(--ink);
  cursor:pointer;box-shadow:var(--shadow-sm)}
.wordBtn:active{transform:scale(.95)}
.wordBtn.right{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.famChip{background:var(--primary);color:#fff;border-radius:16px;padding:10px 26px;font-size:30px;font-weight:bold}

/* fill in the blank */
.sentenceStrip{font-size:30px;font-weight:bold;line-height:1.7;text-align:center}
.gap{display:inline-block;min-width:110px;border-bottom:6px solid var(--primary);
  color:var(--ink-soft);margin:0 6px}
.gap.filled{border-bottom-color:var(--success);color:var(--success);
  animation:snapIn .4s cubic-bezier(.2,1.4,.4,1)}
.cardRow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.wordCard{flex:1 1 150px;min-height:78px;border-radius:18px;border:none;
  background:var(--secondary);font-family:var(--font);font-size:26px;font-weight:bold;color:var(--ink);
  cursor:pointer;box-shadow:var(--shadow-sm)}
.wordCard:active{transform:scale(.95)}
.wordCard.right{background:var(--success);color:#fff}

/* sentence builder */
.buildStrip{min-height:84px;width:100%;border-radius:18px;background:var(--bg-top);
  border:4px dashed var(--line);display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:8px;padding:12px}
.buildStrip.complete{border-style:solid;border-color:var(--success);background:var(--success-bg)}
.slotWord{background:#fff;border-radius:12px;padding:8px 16px;font-size:24px;font-weight:bold;
  box-shadow:var(--shadow-sm);animation:snapIn .3s cubic-bezier(.2,1.4,.4,1)}
.emptySlot{width:60px;height:44px;border-radius:12px;background:rgba(0,0,0,.05)}
.fullStop{font-size:28px;font-weight:bold}
.tileRow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tile{min-height:66px;border-radius:16px;border:3px solid var(--line);background:#fff;
  font-family:var(--font);font-size:24px;font-weight:bold;color:var(--ink);padding:10px 20px;
  cursor:pointer;box-shadow:var(--shadow-sm)}
.tile:active{transform:scale(.94)}
.tile.used{opacity:.22;pointer-events:none}
.shake{animation:shakeX .4s}
@keyframes shakeX{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

/* ---------- teaching overlay ---------- */
.teachOverlay{position:fixed;inset:0;background:rgba(20,25,40,.5);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.teachCard{background:#fff;border-radius:28px;padding:24px;max-width:520px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);
  animation:popUp .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes popUp{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.teachHead{background:var(--secondary);border-radius:999px;padding:8px 20px;font-weight:bold;font-size:16px}
.teachRow{display:flex;align-items:center;gap:16px}
.teachWord{font-size:52px;font-weight:bold;letter-spacing:1px}
.onsetC{color:#4A7FB5}
.rimeC{color:#E2231A}
.teachSub{font-size:20px;font-weight:bold;color:var(--ink-soft)}
.teachBubbles{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.tb{background:var(--bg-top);border:3px solid var(--primary);border-radius:50%;min-width:66px;height:66px;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;padding:0 10px}
.tb.whole{background:var(--success-bg);border-color:var(--success);color:var(--success);border-radius:20px}
.tbPlus{font-size:24px;font-weight:bold;color:var(--ink-soft)}
.famRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.famWord{background:var(--bg-top);border-radius:10px;padding:6px 12px;font-size:19px}
.famWord b{color:#4A7FB5}

/* ---------- result ---------- */
.mascotBig{width:190px;height:150px}
.mascotBig svg{width:100%;height:100%}
.starRow{display:flex;gap:12px}
.starRow svg{width:64px;height:64px;animation:popUp .5s cubic-bezier(.2,1.3,.4,1) backwards}
.starRow svg:nth-child(2){animation-delay:.15s}
.starRow svg:nth-child(3){animation-delay:.3s}
.scoreLine{font-size:20px;font-weight:bold}
.routeDone{background:var(--surface);border-radius:18px;padding:14px 20px;box-shadow:var(--shadow-sm);font-size:15px}

/* ---------- ticket ---------- */
.ticket{background:linear-gradient(135deg,#FFD54A,#FFB300);border-radius:26px;padding:26px 20px;
  color:#5A3B00;box-shadow:0 14px 34px rgba(180,120,0,.35);border:4px dashed #A66A00;max-width:520px}
.ticketArt{width:150px;height:100px;margin:0 auto}
.ticket h1{margin:6px 0;font-size:26px}
.ticketBig{font-size:46px;font-weight:bold;margin:8px 0}
.showTo{margin:14px 0 0;font-size:16px}
.redeemBox{background:#fff;border-radius:18px;padding:16px;margin-top:14px;color:#333;
  display:flex;flex-direction:column;gap:6px;font-size:15px;text-align:left}
.adultNote{font-size:13px;color:#666;margin:6px 0}

/* ---------- menu ---------- */
.menuOverlay{position:fixed;inset:0;background:rgba(20,20,30,.45);z-index:50;
  display:flex;align-items:flex-end;justify-content:center}
.menuSheet{background:var(--surface);width:100%;max-width:1024px;border-radius:26px 26px 0 0;
  padding:22px 22px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.menuSheet h2{margin:0 0 4px}
.menuSheet label{cursor:pointer}

/* ---------- phones ---------- */
@media (max-width:600px){
  .bigTitle{font-size:32px}
  .profileCard svg{width:110px;height:90px}
  .bubble{width:84px;height:84px;font-size:32px}
  .slot{min-width:74px;height:80px;font-size:36px}
  .sentenceStrip{font-size:24px}
  .setGrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .pGrid{grid-template-columns:repeat(5,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- fixed letter chunks in sound questions ---------- */
.fixedSlot{background:var(--bg-top);color:var(--ink);border:5px solid var(--line)}

/* ---------- section headings in the set picker ---------- */
.setSection{grid-column:1/-1;font-size:17px;font-weight:bold;color:var(--ink-soft);
  padding:14px 4px 2px;border-bottom:3px dashed var(--line);margin-top:6px}

/* ---------- teaching card extras ---------- */
.tb.target{background:#FFE2E2;border-color:#E2231A;color:#E2231A}
.teachSub.sm{font-size:15px;margin-top:2px}

/* ---------- voice picker ---------- */
.voicePick{background:var(--bg-top);border-radius:16px;padding:14px;display:flex;
  flex-direction:column;gap:8px}
.voicePick label{font-weight:bold;font-size:16px}
.voicePick select{font-family:var(--font);font-size:17px;padding:12px;border-radius:12px;
  border:2px solid var(--line);background:#fff;color:var(--ink)}

/* ---------- CHEERFUL PROGRESS PAGE ---------- */
.cheerCard{display:flex;align-items:center;gap:16px;border-radius:26px;padding:18px 20px;
  background:linear-gradient(135deg,#FFE99B,#FFC46B);box-shadow:var(--shadow);
  border:4px solid #fff}
[data-theme="animal"] .cheerCard{background:linear-gradient(135deg,#FFD3E8,#C9B6FF)}
.cheerMascot{width:110px;height:88px;flex:0 0 auto;animation:cheerBob 2.6s ease-in-out infinite}
.cheerMascot svg{width:100%;height:100%}
@keyframes cheerBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.cheerText{flex:1}
.cheerBig{font-size:23px;font-weight:bold;color:#4A3300;line-height:1.25}
[data-theme="animal"] .cheerBig{color:#4A3350}
.cheerStats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.statPill{background:rgba(255,255,255,.85);border-radius:999px;padding:6px 14px;
  font-size:14px;font-weight:bold;display:inline-flex;align-items:center;gap:5px}

.bigBar{height:34px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden;position:relative}
.bigBarFill{height:100%;border-radius:999px;display:flex;align-items:center;justify-content:flex-end;
  padding-right:12px;color:#fff;font-weight:bold;font-size:15px;min-width:56px;
  background:linear-gradient(90deg,#FFC20E,#1E8E5A);transition:width .8s cubic-bezier(.4,0,.2,1)}
[data-theme="animal"] .bigBarFill{background:linear-gradient(90deg,#FFB3D1,#7DBE5A)}

.pBlock{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-sm);padding:18px;margin-top:4px}
.pHead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.pTitle{font-weight:bold;font-size:19px}
.pTitle .zh{font-size:15px;color:var(--ink-soft);font-weight:normal}
.pCount{font-size:15px;font-weight:bold;color:var(--primary)}
.pBar{position:relative;height:12px;border-radius:8px;background:rgba(0,0,0,.07);margin:20px 0 26px}
.pBarFill{height:100%;border-radius:8px;background:var(--primary);transition:width .8s cubic-bezier(.4,0,.2,1)}
.pBarMascot{position:absolute;top:-24px;transform:translateX(-50%);width:48px;height:38px;
  transition:left .8s cubic-bezier(.4,0,.2,1)}
.pBarMascot svg{width:100%;height:100%}
.pGrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.pSection{grid-column:1/-1;font-size:14px;font-weight:bold;color:var(--ink-soft);padding:10px 2px 0}
.pCell{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;font-weight:bold;background:#EDF1F6;color:#93A1B3;cursor:pointer;
  border:3px solid transparent;transition:transform .15s}
.pCell:active{transform:scale(.9)}
.pNum{font-size:15px}
.pStars{font-size:9px;line-height:1;color:#B9860B}
.pCell.s1{background:#FFF0C2;color:#8A6A00;border-color:#FFD86B}
.pCell.s2{background:#FFD97A;color:#6B4A00;border-color:#F2A93B}
.pCell.s3{background:linear-gradient(145deg,#7FE0A8,#3EBF84);color:#0B3A26;border-color:#2E9E6B;
  box-shadow:0 3px 0 #2E9E6B}
.pCell.s3 .pStars{color:#0B3A26}

.badgeRow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.badge{background:var(--bg-top);border-radius:16px;padding:12px 6px;text-align:center;opacity:.45}
.badge svg{width:34px;height:34px;margin:0 auto}
.badge.on{opacity:1;background:#FFF3D1;box-shadow:var(--shadow-sm)}
.bLbl{font-size:11px;color:var(--ink-soft);margin-top:5px;font-weight:bold}

.weakRow{display:flex;gap:8px;flex-wrap:wrap}
.weakChip{background:var(--warn);border:2px solid #F1C40F;border-radius:10px;padding:6px 12px;
  font-size:17px;font-weight:bold}

@media (max-width:600px){
  .pGrid{grid-template-columns:repeat(5,1fr)}
  .badgeRow{grid-template-columns:repeat(2,1fr)}
  .cheerBig{font-size:19px}
  .cheerMascot{width:84px;height:70px}
}

/* ---------- "turn on sound" banner (iOS blocks audio until a real tap) ---------- */
.soundBanner{display:flex;align-items:center;justify-content:center;gap:8px;
  background:#FFF3CD;border:3px solid #F1C40F;border-radius:14px;
  padding:12px 16px;margin:8px 18px 0;font-weight:bold;font-size:16px;
  color:#5c4400;cursor:pointer;animation:nudge 2.2s ease-in-out infinite}
.soundBanner:active{transform:scale(.97)}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

/* ---------- Video Time Ticket (lives only in My Progress > My badges) ---------- */
.ticketCard{margin-top:16px;border-radius:22px;padding:20px 16px;text-align:center}
.ticketCard.live{background:linear-gradient(135deg,#FFD54A,#FFB300);color:#5A3B00;
  border:4px dashed #A66A00;box-shadow:0 12px 26px rgba(180,120,0,.32);
  animation:ticketPulse 2.4s ease-in-out infinite}
@keyframes ticketPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
.ticketCard.live h2{margin:6px 0;font-size:22px}
.ticketCard.locked{background:var(--bg-top);border:3px dashed var(--line)}
.ticketArt{width:140px;height:94px;margin:0 auto}
.ticketArtDim{width:96px;height:64px;margin:0 auto;opacity:.35;filter:grayscale(1)}
.lockedTitle{font-weight:bold;font-size:17px;color:var(--ink-soft);margin-top:6px}
.lockedSub{font-size:14px;color:var(--ink-soft);margin-top:8px}
.ticketBar{height:14px;border-radius:999px;background:rgba(0,0,0,.09);overflow:hidden;margin:12px 24px 0}
.ticketBarFill{height:100%;border-radius:999px;background:linear-gradient(90deg,#FFC20E,#F2994A);
  transition:width .8s cubic-bezier(.4,0,.2,1)}

/* result-screen ticket status */
.ticketWon{display:flex;align-items:center;gap:14px;text-align:left;
  background:linear-gradient(135deg,#FFD54A,#FFB300);color:#5A3B00;
  border-radius:20px;padding:14px 18px;border:3px dashed #A66A00;font-size:16px}
.ticketWon svg{width:76px;height:52px;flex:0 0 auto}
.ticketSoon{background:var(--surface);border-radius:16px;padding:12px 18px;
  font-size:15px;color:var(--ink-soft);box-shadow:var(--shadow-sm)}


/* =========================================================================
   DESKTOP / LAPTOP SUPPORT
   The app is touch-first, but on a real pointer device we add hover feedback,
   keyboard hints and a roomier layout so it works properly on a computer.
========================================================================= */

/* keyboard hint: hidden on touch devices, shown when a mouse is present */
.kbdHint{display:none;text-align:center;font-size:13px;color:var(--ink-soft);
  background:var(--surface);border-radius:12px;padding:8px 14px;
  box-shadow:var(--shadow-sm);margin-top:4px}
.kbdHint b{background:var(--bg-top);border:2px solid var(--line);border-radius:6px;
  padding:1px 7px;margin:0 1px;font-size:12px}

@media (hover:hover) and (pointer:fine){
  .kbdHint{display:block}
  .btn,.bubble,.wordBtn,.wordCard,.tile,.choiceBtn,.setCard,.profileCard,
  .gameCard,.pCell,.iconBtn,.speakBtn,.menuBtn,.soundBanner{cursor:pointer}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,30,50,.18)}
  .bubble:hover{transform:translateY(-4px) scale(1.04);
    box-shadow:0 14px 26px rgba(20,30,50,.24), inset 0 -8px 14px rgba(0,0,0,.06)}
  .wordBtn:hover,.wordCard:hover,.tile:hover{transform:translateY(-3px);
    border-color:var(--primary);box-shadow:0 10px 20px rgba(20,30,50,.18)}
  .setCard:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--primary)}
  .profileCard:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 18px 36px rgba(20,30,50,.22)}
  .gameCard:hover{transform:translateX(4px);box-shadow:0 12px 26px rgba(20,30,50,.18)}
  .pCell:hover{transform:scale(1.12);box-shadow:var(--shadow-sm)}
  .speakBtn:hover{transform:scale(1.06)}
  .iconBtn:hover{background:var(--bg-top)}
}

/* visible focus ring for keyboard/accessibility */
button:focus-visible,select:focus-visible,.setCard:focus-visible{
  outline:4px solid var(--primary);outline-offset:3px}

/* --- roomier layout on a laptop/desktop screen --- */
@media (min-width:900px){
  #app{max-width:1150px}
  .screen{padding:10px 40px 40px;gap:20px}
  h1{font-size:34px}
  .bigTitle{font-size:46px}
  .qCard{padding:34px 30px;gap:22px}
  .qLabel{font-size:23px}
  .picRound{width:180px;height:180px;padding:26px}
  .bubble{width:124px;height:124px;font-size:46px}
  .wordBtn{min-height:96px;font-size:34px}
  .wordCard{min-height:88px;font-size:30px}
  .tile{font-size:27px;padding:12px 24px;min-height:72px}
  .slot{min-width:110px;height:112px;font-size:54px}
  .sentenceStrip{font-size:36px}
  .buildStrip{min-height:96px}
  .slotWord{font-size:27px}
  .setGrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
  .profileGrid{max-width:720px;gap:30px}
  .profileCard svg{width:190px;height:150px}
  .pName{font-size:22px}
  .gameName{font-size:25px}
  .gameIcon{width:70px;height:70px}
  .travelStage{height:190px}
  .travelMascot{width:200px;height:150px}
  .travelStop{font-size:40px}
  .journeyWrap{padding:4px 40px 0}
  .jTrack{margin:24px 40px 34px}
  .jMascot{width:78px;height:62px;top:-30px}
  .mascotBig{width:230px;height:180px}
  .starRow svg{width:76px;height:76px}
  .teachCard{max-width:620px;padding:30px}
  .teachWord{font-size:62px}
  .menuSheet{max-width:640px;border-radius:26px;margin-bottom:40px}
  .menuOverlay{align-items:center}
}
@media (min-width:1400px){
  #app{max-width:1280px}
}

/* result message from the Test sound button (only shown after pressing it) */
.soundMsg{background:#FFF3CD;border:3px solid #F1C40F;border-radius:14px;
  padding:12px 14px;font-size:14px;line-height:1.5;color:#5c4400}


/* =========================================================================
   WORD EXPLORER v7 — RESPONSIVE VISUAL REFRESH
   Keeps the original learning logic; improves hierarchy, touch ergonomics,
   safe-area handling, and desktop / iPad / phone layouts.
========================================================================= */
:root{
  --font:'Avenir Next','Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;
  --surface:rgba(255,255,255,.94);
  --surface-solid:#fff;
  --ink:#17304F;
  --ink-soft:#667892;
  --line:rgba(23,48,79,.10);
  --shadow:0 18px 44px rgba(38,58,88,.11);
  --shadow-sm:0 7px 18px rgba(38,58,88,.10);
  --radius-xl:30px;
  --radius-lg:24px;
  --radius-md:18px;
  --content:1180px;
}
[data-theme="train"]{
  --bg-top:#F4F8FC;--bg-bot:#E4EEF7;--primary:#E94338;--secondary:#FFD45C;
}
[data-theme="animal"]{
  --bg-top:#FFF7FB;--bg-bot:#F9EAF3;--primary:#F76F9B;--secondary:#C7AEFF;
}
html{min-height:100%;background:var(--bg-bot)}
body{
  min-height:100%;min-height:100svh;overflow-x:hidden;overflow-y:auto;
  background:
    radial-gradient(circle at 8% 12%,rgba(255,255,255,.78) 0 7%,transparent 7.2%),
    radial-gradient(circle at 92% 18%,rgba(255,255,255,.58) 0 6%,transparent 6.2%),
    linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%);
  background-attachment:fixed;
  letter-spacing:.005em;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.28;
  background-image:radial-gradient(rgba(30,62,96,.14) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:linear-gradient(to bottom,black,transparent 72%);
}
#app{max-width:none;min-height:100svh;padding-bottom:max(env(safe-area-inset-bottom),12px)}

.topbar{
  padding:max(10px,env(safe-area-inset-top)) clamp(14px,3vw,34px) 10px;
  background:rgba(246,250,253,.74);border-bottom:1px solid rgba(255,255,255,.65);
  backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
}
[data-theme="animal"] .topbar{background:rgba(255,248,252,.78)}
.topRow{max-width:var(--content);margin:0 auto;min-height:54px}
.topTitle{font-size:clamp(18px,2.1vw,22px);font-weight:800;letter-spacing:-.01em}
.iconBtn{
  width:48px;height:48px;padding:12px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.85);
  box-shadow:0 5px 16px rgba(35,55,85,.09);transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
}

.screen{
  width:min(100%,var(--content));margin:0 auto;
  padding:clamp(14px,2.6vw,30px) clamp(16px,4vw,46px) clamp(30px,5vw,58px);
  gap:clamp(14px,2vw,22px);
}
h1{font-size:clamp(28px,4vw,42px);line-height:1.08;letter-spacing:-.035em;margin:4px 0}
h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.02em}
.bigTitle{font-size:clamp(38px,7vw,64px);line-height:1;letter-spacing:-.055em}
p.sub,.sub{font-size:clamp(14px,1.7vw,17px);line-height:1.45}
.card,.qCard,.pBlock,.mascotBanner,.gameCard,.profileCard{border:1px solid rgba(255,255,255,.88)}

.btn{
  min-height:58px;border-radius:17px;font-size:clamp(17px,2vw,20px);font-weight:800;
  box-shadow:0 6px 16px rgba(38,58,88,.11);transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;
}
.btn-primary{box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 24%,transparent)}
.btn-secondary{background:rgba(255,255,255,.9);border:2px solid rgba(23,48,79,.09)}
.btn.small{min-height:48px}

/* Profile selection */
.pickerScreen{min-height:0;flex:1;justify-content:center;padding-top:clamp(18px,4vh,42px);padding-bottom:clamp(24px,5vh,52px)}
.pickerScreen::before{
  content:'ABC';display:grid;place-items:center;width:88px;height:54px;border-radius:18px;
  margin-bottom:4px;font-size:27px;font-weight:900;letter-spacing:5px;color:var(--primary);
  background:rgba(255,255,255,.8);box-shadow:var(--shadow-sm);transform:rotate(-3deg)
}
.profileGrid{max-width:760px;gap:clamp(14px,3vw,28px);margin-top:clamp(12px,2vw,22px)}
.profileCard{
  min-height:250px;padding:clamp(18px,3vw,28px);border-radius:var(--radius-xl);border-width:2px;
  box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease;
  justify-content:center;
}
.profileCard.little{background:linear-gradient(160deg,#fff 42%,#FFF2DB);border-color:rgba(233,67,56,.17)}
.profileCard.big{background:linear-gradient(160deg,#fff 42%,#FCE9F4);border-color:rgba(247,111,155,.18)}
.profileCard svg{width:clamp(126px,20vw,188px);height:clamp(100px,16vw,150px)}
.pName{font-size:clamp(20px,2.4vw,25px);font-weight:900}

/* Home dashboard */
.homeScreen{align-content:start}
.mascotBanner{
  min-height:126px;border-radius:var(--radius-xl);padding:clamp(18px,3vw,28px);
  background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(255,255,255,.82));
  box-shadow:var(--shadow);overflow:hidden;position:relative;
}
.mascotBanner::after{
  content:'';position:absolute;right:-45px;top:-60px;width:190px;height:190px;border-radius:50%;
  background:var(--secondary);opacity:.16;pointer-events:none
}
.mascotBanner svg{width:clamp(94px,13vw,132px);height:clamp(74px,10vw,104px);z-index:1}
.bannerBig{font-size:clamp(23px,3vw,31px);line-height:1.15;font-weight:900;letter-spacing:-.025em}
.gameCard{
  position:relative;min-height:132px;border-radius:var(--radius-lg);padding:20px;
  border-left:0;border-top:7px solid var(--primary);box-shadow:var(--shadow-sm);
  transition:transform .16s ease,box-shadow .16s ease;border-color .16s ease;
  overflow:hidden;
}
.gameCard.sentence{border-top-color:var(--secondary)}
.gameCard.fill{border-top-color:var(--success)}
.gameIcon{width:64px;height:64px;border-radius:19px;padding:12px;background:linear-gradient(145deg,var(--bg-top),#fff);box-shadow:inset 0 0 0 1px rgba(23,48,79,.05)}
.gameName{font-size:clamp(20px,2.3vw,25px);font-weight:900;letter-spacing:-.02em}
.gameHint{font-size:14px;line-height:1.35;margin-top:3px}
.gameMeta{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;margin-top:8px}
.gameProgress{height:7px;border-radius:999px;background:rgba(23,48,79,.08);overflow:hidden;margin-top:13px}
.gameProgress span{display:block;height:100%;border-radius:inherit;background:var(--primary)}
.gameCard.sentence .gameProgress span{background:#D5A900}
.gameCard.fill .gameProgress span{background:var(--success)}
.gameGo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg-top);font-size:22px;font-weight:900;flex:0 0 auto}

/* Set picker */
.setsScreen>.sub{max-width:760px;margin:0 auto 4px}
.setGrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:clamp(12px,1.7vw,18px)}
.setSection{padding-top:20px;font-size:16px;border-bottom:0;display:flex;align-items:center;gap:10px}
.setSection::after{content:'';height:2px;background:var(--line);flex:1;border-radius:99px}
.setCard{
  min-height:136px;padding:18px 14px 15px;border-radius:21px;border:2px solid transparent;box-shadow:0 7px 18px rgba(38,58,88,.08);
  display:flex;flex-direction:column;justify-content:center;
}
.setCard.played{border-color:rgba(30,142,90,.18);background:linear-gradient(180deg,#fff,#FAFFFC)}
.setNum{top:11px;left:13px;font-size:12px;background:var(--bg-top);padding:4px 8px;border-radius:999px}
.setName{font-size:17px;line-height:1.2;margin:16px 0 9px}
.setBest{font-size:12px}

/* Journey */
.journeyWrap{width:min(100%,var(--content));margin:0 auto;padding:8px clamp(20px,5vw,54px) 0}
.jHead{font-size:12px;margin-bottom:6px}
.jTrack{height:11px;margin:20px 28px 22px;background:rgba(23,48,79,.09)}
.jDot{width:11px;height:11px;border-width:2px}
.jMascot{width:58px;height:46px;top:-23px}

/* Question stage */
.playScreen{align-items:center;padding-top:16px}
.playScreen>.qCard{width:min(100%,940px)}
.qCard{
  border-radius:32px;padding:clamp(22px,4vw,38px);gap:clamp(15px,2.4vw,24px);
  box-shadow:0 20px 50px rgba(38,58,88,.12);background:rgba(255,255,255,.96)
}
.qCard.phonicsCard,.qCard.sentCard{border-width:3px}
.qCard.fillCard{border-width:3px}
.qLabel{font-size:clamp(19px,2.4vw,25px);line-height:1.3;font-weight:900;letter-spacing:-.015em}
.picRound{width:clamp(124px,17vw,172px);height:clamp(124px,17vw,172px);padding:clamp(18px,2.6vw,25px);background:linear-gradient(145deg,var(--bg-top),#fff)}
.speakBtn{width:70px;height:70px;padding:19px;box-shadow:0 8px 20px rgba(38,58,88,.12)}
.speakBtn.big{width:98px;height:98px;padding:27px}
.wordSlots{gap:clamp(7px,1.6vw,13px);max-width:100%;justify-content:center}
.slot{min-width:clamp(70px,11vw,104px);height:clamp(74px,11vw,104px);font-size:clamp(34px,6vw,52px);border-radius:20px}
.bubbleRow,.wordRow,.cardRow,.tileRow{gap:clamp(10px,2vw,18px)}
.bubble{width:clamp(80px,11vw,112px);height:clamp(80px,11vw,112px);font-size:clamp(31px,4.2vw,42px);animation-duration:4.6s}
.wordBtn{min-height:82px;flex:1 1 150px;font-size:clamp(25px,3.6vw,32px);border-radius:19px}
.wordCard{min-height:76px;flex:1 1 150px;font-size:clamp(23px,3vw,29px)}
.sentenceStrip{font-size:clamp(23px,4vw,34px);line-height:1.55}
.gap{min-width:clamp(86px,15vw,125px);border-bottom-width:5px}
.buildStrip{min-height:92px;padding:14px;border-radius:20px}
.slotWord,.tile{font-size:clamp(20px,2.8vw,27px)}
.tile{min-height:62px;padding:10px 18px}
.kbdHint{box-shadow:none;border:1px solid var(--line);background:rgba(255,255,255,.64)}

/* Results */
.resultScreen{max-width:760px;justify-content:flex-start;padding-top:clamp(28px,6vh,62px)}
.resultScreen h1{text-align:center}
.mascotBig{width:clamp(160px,26vw,220px);height:clamp(128px,20vw,174px)}
.starRow svg{width:clamp(54px,9vw,72px);height:clamp(54px,9vw,72px)}
.scoreLine{font-size:clamp(18px,2.4vw,22px)}
.routeDone,.ticketSoon{width:100%;border:1px solid var(--line)}
.ticketWon{width:100%}

/* Progress */
.progressScreen{max-width:1120px}
.cheerCard{border-width:2px;border-radius:28px;padding:clamp(17px,3vw,25px);box-shadow:var(--shadow)}
.cheerBig{font-size:clamp(20px,2.6vw,28px)}
.statPill{padding:7px 12px;background:rgba(255,255,255,.78);font-size:13px}
.bigBar{height:28px;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.pBlock{border-radius:24px;padding:clamp(16px,2.5vw,24px);box-shadow:0 8px 22px rgba(38,58,88,.08)}
.pTitle{font-size:20px}
.pGrid{grid-template-columns:repeat(10,minmax(42px,1fr));gap:8px}
.pCell{min-width:0;border-radius:13px}
.badge{border-radius:16px}

/* Menu */
.menuOverlay{background:rgba(22,31,46,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.menuSheet{max-width:640px;max-height:min(88svh,780px);overflow:auto;border-radius:30px 30px 0 0;padding-top:12px;box-shadow:0 -20px 60px rgba(15,25,40,.22)}
.sheetHandle{width:46px;height:5px;border-radius:999px;background:rgba(23,48,79,.16);margin:0 auto 4px}
.voicePick{border:1px solid var(--line)}

.soundBanner{width:min(calc(100% - 30px),720px);margin:8px auto 0;padding:10px 14px;border-width:2px;font-size:14px;box-shadow:0 5px 14px rgba(74,54,0,.07)}

/* Tablet / small desktop: turn the home into a true dashboard. */
@media (min-width:720px){
  .homeScreen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
  .homeScreen>.mascotBanner,.homeScreen>.btn-wide{grid-column:1/-1}
  .homeScreen>.gameCard{height:100%;min-height:245px;flex-direction:column;align-items:flex-start;gap:13px;padding:22px}
  .homeScreen>.gameCard .gameText{width:100%}
  .homeScreen>.gameCard .gameGo{position:absolute;top:21px;right:18px}
  .homeScreen>.gameCard .gameIcon{width:70px;height:70px}
  .homeScreen>.gameCard .gameMeta{margin-top:10px}
  .setGrid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}
}

/* Desktop: use width, don't merely scale the mobile stack. */
@media (min-width:1024px){
  :root{--content:1240px}
  .screen{padding-left:54px;padding-right:54px}
  .homeScreen>.gameCard{min-height:270px;padding:26px}
  .homeScreen>.gameCard .gameIcon{width:78px;height:78px;padding:14px}

let englishVoice = null;
/* Clear, warm female voices first — these are the ones children hear best.
   Listed roughly by clarity: Apple (iPad/Mac), then Google, then Microsoft. */
/* Only these three voices are offered, in this order of preference. */
const PREFERRED_VOICES = ['Samantha','Karen','Daniel'];
const VOICE_LABELS = { 'Samantha':'Samantha (en-US)', 'Karen':'Karen (en-AU)', 'Daniel':'Daniel (en-GB)' };

let allVoices = [];
function initVoices(){
  if(!('speechSynthesis' in window)) return;
  const p = ()=>{
    allVoices = speechSynthesis.getVoices() || [];
    const en = allVoices.filter(x=>x.lang && x.lang.toLowerCase().startsWith('en'));
    if(!en.length) return;
    // an adult's saved choice always wins
    const saved = rawGet('wordexplorer_voice');
    if(saved){ const m = en.find(x=>x.name===saved);
               if(m){ englishVoice=m; return; } }
    for(const name of PREFERRED_VOICES){
      const hit = en.find(x=>x.name === name) || en.find(x=>x.name.indexOf(name)>=0);
      if(hit){ englishVoice = hit; return; }
    }
    // None of the three are installed (common on Windows) - fall back to any
    // English voice so the app still talks.
    englishVoice = en.find(x=>x.lang==='en-GB') || en.find(x=>x.lang==='en-US') || en[0] || null;
  };
  p(); speechSynthesis.onvoiceschanged = p;
}
/* adult picks a clearer voice from the menu; remembered on this device */
function setVoice(name){
  const m = allVoices.find(v=>v.name===name);
  if(m){ englishVoice = m; rawSet('wordexplorer_voice', name); }
  speak('Hello! Are you ready to play?');
  render();
}
/* ---------------------------------------------------------------------------
   SPEECH QUEUE
   Earlier versions called speechSynthesis.cancel() before EVERY utterance and
   spaced them on fixed timers. Two problems: a part could be cut off before it
   finished, and on iOS Safari rapid cancel() calls jam the speech queue so that
   nothing speaks again until reload. Everything now goes through one queue that
   cancels ONCE, then chains the next part from the previous part's onend event.
--------------------------------------------------------------------------- */
let speechToken = 0;          // invalidates an older sequence when a new one starts
let speechUnlocked = false;
let speechOk = false;         // true once the device has actually produced sound
let voiceBroken = false;      // set if the chosen voice turns out to be unusable

function markSpeechOk(){
  if(speechOk) return;
  speechOk = true;
  const b=document.getElementById('soundBanner');
  if(b) b.style.display='none';
}
/* Tapped from the "turn on sound" banner. Speaks synchronously inside the tap,
   which is the only thing iOS reliably accepts. */
function enableSound(){
  speechUnlocked=true;
  state.soundMsg='Listening... you should hear a beep, then a voice.';
  render();
  chime('success');                      // proves whether audio output works at all
  // spoken synchronously inside the tap - the only thing iOS reliably accepts
  speakNow('Great! The sound is working.', 0.85, null);
  setTimeout(()=>{
    if(!('speechSynthesis' in window))
      state.soundMsg='This browser does not support speech at all.';
    else if(!allVoices.length)
      state.soundMsg='No voices are installed on this computer, so the app cannot talk. '+
                     'Windows: Settings > Time & Language > Speech. Mac: System Settings > '+
                     'Accessibility > Spoken Content. Linux: install speech-dispatcher.';
    else if(speechOk)
      state.soundMsg='Sound is working.';
    else
      state.soundMsg='Did you hear the beep? If yes, audio works but the voice did not play - '+
                     'try another voice below. If no beep either, check the volume and that '+
                     'this tab is not muted.';
    render();
  }, 2500);
}

/* iOS will not speak unless synthesis was first triggered by a real user tap. */
function unlockSpeech(){
  // Deliberately does NOT speak anything. A silent priming utterance leaves the
  // engine "speaking", which forces a cancel() on the next real utterance and
  // that is exactly what silences desktop Chrome. Real audio is unlocked by the
  // profile tap, which speaks a genuine greeting inside the gesture.
  speechUnlocked = true;
}

/* Speak ONE utterance.

   The bug this avoids: calling speechSynthesis.cancel() and then speak() in the
   SAME tick makes Chrome (and sometimes Safari) silently drop the utterance -
   no sound, no error, no events. So we only cancel when something is actually
   playing, and when we do, we speak on the NEXT tick instead.

   iOS additionally requires the first utterance to begin inside a real user
   gesture, so when nothing is playing we speak synchronously. */
function speakNow(text, rate, onDone){
  let started=false, done=false;
  const finish=()=>{ if(done) return; done=true; if(onDone) onDone(); };

  const say=(useVoice)=>{
    try{
      const u=new SpeechSynthesisUtterance(text);
      if(useVoice && englishVoice && !voiceBroken){
        u.voice=englishVoice;
        u.lang=englishVoice.lang||'en-GB';
      }
      u.rate=rate||0.85; u.pitch=1.05; u.volume=1;
      u.onstart=()=>{ started=true; markSpeechOk(); };
      u.onend  =()=>{ started=true; markSpeechOk(); finish(); };
      u.onerror=()=>{ finish(); };
      // Chrome can silently enter a paused state in which speak() queues but
      // never plays. resume() is harmless when it is not paused.
      try{ speechSynthesis.resume(); }catch(e){}
      speechSynthesis.speak(u);
      try{ speechSynthesis.resume(); }catch(e){}
    }catch(e){ finish(); }
  };

  let busy=false;
  try{ busy = speechSynthesis.speaking || speechSynthesis.pending; }catch(e){}
  if(busy){
    try{ speechSynthesis.cancel(); }catch(e){}
    setTimeout(()=>say(true), 90);      // NEVER cancel and speak in one tick
  }else{
    say(true);                          // synchronous: satisfies the iOS gesture rule
  }

  /* If the chosen voice is unusable the utterance vanishes with no events.
     Retry once with the browser default - without cancelling, which would
     itself drop the retry. */
  setTimeout(()=>{
    if(started || done) return;
    let playing=false;
    try{ playing = speechSynthesis.speaking || speechSynthesis.pending; }catch(e){}
    if(playing) return;                 // it is just slow to start - leave it alone
    voiceBroken=true;
    say(false);
  }, 2200);

  setTimeout(finish, 3500 + text.length*95);   // keeps the queue moving
}

function speakQueue(parts, gapMs, onDone){
  const list=(parts||[]).map(p=>p==null?'':String(p)).filter(p=>p.trim()!=='');
  const gap=(gapMs===undefined)?350:gapMs;
  if(!('speechSynthesis' in window) || !list.length){
    if(onDone) setTimeout(onDone, 300);
    return;
  }
  const mine=++speechToken;
  let i=0;
  const step=()=>{
    if(mine!==speechToken) return;              // a newer sequence replaced us
    if(i>=list.length){ if(onDone) onDone(); return; }
    const text=list[i++];
    speakNow(text, text.length<=4 ? 0.6 : 0.85, ()=>{
      if(mine!==speechToken) return;
      setTimeout(step, gap);
    });
  };
  step();   // MUST be synchronous: iOS blocks speech started from a timer
}

function speak(text, rate){ speakQueue([text], 0); }

/* speak, WAIT for it to finish, then pause gapMs, then run cb */
function speakThen(text, pauseMs, cb){
  speakQueue([text], (pauseMs===undefined?2000:pauseMs), cb);
}

/* speak parts in order, each waiting for the previous to finish */
function speakSeq(parts, gap){
  speakQueue(parts, Math.min(gap===undefined?350:gap, 650));
}

/* Safari/Chrome sometimes leave synthesis paused; nudge it back to life. */
if(typeof window!=='undefined' && 'speechSynthesis' in window){
  setInterval(()=>{
    try{ if(speechSynthesis.paused && speechSynthesis.speaking) speechSynthesis.resume(); }catch(e){}
  }, 2500);
}

let audioCtx=null;
function chime(kind){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    const map={ success:[523.25,659.25,783.99], ticket:[523.25,659.25,783.99,1046.5],
                nudge:[392,330], travel:[440,554.37], pop:[880] };
    (map[kind]||map.pop).forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.001, now+i*0.1);
      g.gain.exponentialRampToValueAtTime(0.16, now+i*0.1+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now+i*0.1+0.30);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now+i*0.1); o.stop(now+i*0.1+0.33);
    });
  }catch(e){}
}

/* =========================================================================
   PHONICS PRONUNCIATION
   Speech engines read a bare letter as its NAME ("f" -> "eff", "a" -> "ay"),
   which is exactly the mistake phonics teaching exists to prevent. Every
   spelling below was tested against a speech engine and produces the correct
   PHONEME: "fuh" -> /f/, "cluh" -> /kl/, "shuh" -> /ʃ/.
   The letter is always SHOWN on screen; only the audio uses these spellings.
========================================================================= */
const SOUND_SAY = {
  b:'buh', c:'kuh', d:'duh', f:'fuh', g:'guh', h:'huh', j:'juh', k:'kuh',
  l:'luh', m:'muh', n:'nuh', p:'puh', q:'kwuh', r:'ruh', s:'suh', t:'tuh',
  v:'vuh', w:'wuh', y:'yuh', z:'zuh',
  ch:'chuh', sh:'shuh', th:'thuh', wh:'wuh', qu:'kwuh',
  bl:'bluh', cl:'cluh', cr:'cruh', dr:'druh', fl:'fluh', fr:'fruh',
  gl:'gluh', gr:'gruh', pl:'pluh', pr:'pruh', sk:'skuh', sl:'sluh',
  sm:'smuh', sn:'snuh', sp:'spuh', st:'stuh', sw:'swuh', tr:'truh', tw:'twuh'
};
/* Some rimes are read as abbreviations: "eg" -> "for example", "id" -> "I.D.",
   "ip" -> "I.P.". These respellings were tested to give the right sound.     */
const RIME_SAY = { eg:'egg', id:'ydd', ip:'ipp' };
/* Short vowels cannot be said alone (a bare "a" becomes the long name "ay"),
   so they are always demonstrated inside a real anchor word.                 */
const VOWEL_ANCHOR = { a:'at', e:'egg', i:'in', o:'on', u:'up' };

function sayGrapheme(g){ return SOUND_SAY[String(g).toLowerCase()] || g; }
function sayRime(r){ return RIME_SAY[String(r).toLowerCase()] || r; }
/* Jolly-Phonics style anchoring, as HK P1 teachers say it: "fuh, as in fan" */
function sayAnchored(g, word){ return sayGrapheme(g)+', as in '+word; }

/* =========================================================================
   HELPERS
========================================================================= */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a,n){ return shuffle(a).slice(0,n); }
/* deterministic shuffle so a given set always produces the same 10 questions */
function seededShuffle(arr, seed){
  const a=arr.slice(); let s=seed*9301+49297;
  for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor((s/233280)*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function themeSub(str){
  const t = THEME_WORDS[currentTheme()] || THEME_WORDS.animal;
  return str.replace(/\{N\}/g,t.N).replace(/\{P\}/g,t.P).replace(/\{F\}/g,t.F);
}
function currentProfile(){
  // never return null: a stray timer can call this after "Switch child"
  return CONFIG.profiles[state.profileId] || CONFIG.profiles.little;
}
function currentTheme(){ return currentProfile() ? currentProfile().theme : 'animal'; }
function icon(id,cls){ return '<svg class="icon '+(cls||'')+'"><use href="#'+id+'"/></svg>'; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* =========================================================================
   QUESTION BUILDERS — each returns exactly 10 questions for a given set
========================================================================= */

/* ---- PHONICS: one word family per set, mixed interactive question types ---- */
/* Phonics sets 0..19 are word families; 20+ are the sound sets. */
function buildPhonics(setIdx){
  if(setIdx >= WORD_FAMILIES.length) return buildSoundSet(PHONICS_EXTRA[setIdx-WORD_FAMILIES.length], setIdx);
  return buildFamilySet(setIdx);
}

/* ---- beginning sound / ending sound / middle vowel / blend ---- */
function buildSoundSet(set, setIdx){
  const pool   = seededShuffle(set.words, setIdx+1);
  const iconed = pool.filter(w=>w.icon);
  const qs=[];

  const make = (w)=>{
    if(set.mode==='begin'){
      return { type:'begin', mode:'begin', word:w.w, icon:w.icon, answer:w.w[0],
               pre:'', post:w.w.slice(1), label:'Which sound does it START with?',
               choices: shuffle(set.letters.slice()) };
    }
    if(set.mode==='end'){
      const last=w.w.slice(-1);
      return { type:'end', mode:'end', word:w.w, icon:w.icon, answer:last,
               pre:w.w.slice(0,-1), post:'', label:'Which sound does it END with?',
               choices: shuffle(set.letters.slice()) };
    }
    if(set.mode==='vowel'){
      return { type:'vowel', mode:'vowel', word:w.w, icon:w.icon, answer:w.w[1],
               pre:w.w[0], post:w.w.slice(2), label:'Which vowel is in the MIDDLE?',
               choices: shuffle(set.vowels.slice()) };
    }
    const bl = set.blends.find(b=>w.w.startsWith(b));
    // ch/sh/th/wh are digraphs: two letters making ONE sound, not a blend
    const DIGRAPHS=['ch','sh','th','wh','qu'];
    const allDigraph = set.blends.every(b=>DIGRAPHS.indexOf(b)>=0);
    return { type:'blend', mode:'blend', word:w.w, icon:w.icon, answer:bl,
             pre:'', post:w.w.slice(bl.length),
             label: allDigraph ? 'Which sound starts this word?'
                               : 'Which blend starts this word?',
             choices: shuffle(set.blends.slice()) };
  };

  // prefer words that have a picture, then wrap round the rest
  for(let i=0;i<10;i++){
    const src = (i<iconed.length) ? iconed : pool;
    qs.push(make(src[i % src.length]));
  }
  return qs;
}

function buildFamilySet(setIdx){
  const fam    = WORD_FAMILIES[setIdx];
  const rime   = fam.rime;
  const others = WORD_FAMILIES.filter((f,i)=>i!==setIdx);
  // only words that genuinely split as onset + rime can be used
  const valid  = fam.words.filter(w=> w.w.length>rime.length && w.w.slice(w.w.length-rime.length)===rime );
  const pool   = seededShuffle(valid, setIdx+1);
  const iconed = pool.filter(w=>w.icon);
  const famOnsets = new Set(valid.map(w=>w.w.slice(0,w.w.length-rime.length).toLowerCase()));
  const qs=[];

  const makeBuild = (w)=>{
    const onset = w.w.slice(0, w.w.length-rime.length);
    const wrong = pick('bcdfghjklmnprstvwz'.split('').filter(c=>!famOnsets.has(c)), 2);
    return { type:'build', word:w.w, icon:w.icon, rime:rime, onset:onset,
             choices: shuffle([onset, ...wrong]) };
  };
  const makeListen = (w)=>{
    const same = valid.filter(x=>x.w!==w.w).map(x=>x.w);
    const fill = same.length>=2 ? pick(same,2)
               : [...same, ...pick(others,2-same.length).map(f=>pick(f.words,1)[0].w)];
    return { type:'listen', word:w.w, icon:w.icon, rime:rime, choices: shuffle([w.w, ...fill]) };
  };
  const makeSort = (w)=>{
    const foreign=[]; const used=new Set([w.w]);
    shuffle(others).forEach(f=>{ if(foreign.length<2){ const c=pick(f.words,1)[0].w;
      if(!used.has(c)){ used.add(c); foreign.push(c); } } });
    return { type:'sort', word:w.w, rime:rime, choices: shuffle([w.w, ...foreign]) };
  };

  // cycle the three question types, wrapping around the word list so that
  // even a small family (3 words) still fills a full 10-question round
  const order=['build','listen','sort','build','sort','listen','build','listen','sort','build'];
  order.forEach((kind,i)=>{
    if(kind==='build'){
      const src = iconed.length ? iconed : pool;
      qs.push(makeBuild(src[i % src.length]));
    } else if(kind==='listen'){
      qs.push(makeListen(pool[i % pool.length]));
    } else {
      qs.push(makeSort(pool[i % pool.length]));
    }
  });
  return qs.slice(0,10);
}

/* ---- SENTENCE: exactly the words needed, no extras ---- */
function buildSentence(setIdx){
  return SENT_SETS[setIdx].s.map(raw=>{
    const text = themeSub(raw);
    const words = text.split(' ');
    return { type:'sentence', words:words, tiles: shuffle(words.map((w,i)=>({w:w,id:i}))) };
  });
}

/* ---- FILL: sentence with a gap + 3 word cards ---- */
function buildFill(setIdx){
  return FILL_SETS[setIdx].q.map(raw=>{
    const p = raw.split('|');
    return { type:'fill', sentence: themeSub(p[0]), answer:p[1],
             choices: shuffle([p[1],p[2],p[3]]) };
  });
}

function buildRound(cat, setIdx){
  if(cat==='phonics')  return buildPhonics(setIdx);
  if(cat==='sentence') return buildSentence(setIdx);
  return buildFill(setIdx);
}
function setTitle(cat, i){
  if(cat==='phonics'){
    return i < WORD_FAMILIES.length ? '-'+WORD_FAMILIES[i].rime+' family'
                                    : PHONICS_EXTRA[i-WORD_FAMILIES.length].title;
  }
  if(cat==='sentence') return themeSub(SENT_SETS[i].t);
  return FILL_SETS[i].t;
}

/* =========================================================================
   JOURNEY — 11 stops, one leg travelled after each correct question
========================================================================= */
function journeyFor(setIdx){
  if(currentTheme()==='train'){
    const line = MTR_LINES[setIdx % MTR_LINES.length];
    return { name:line.name, color:line.color, stops:line.stops, kind:'train' };
  }
  const r = GARDEN_ROUTES[setIdx % GARDEN_ROUTES.length];
  return { name:r.name, color:r.color, stops:r.stops, kind:'garden' };
}

   APP STATE
========================================================================= */
const state = {
  screen:'picker', profileId:null, data:null,
  category:null, setIndex:null, questions:[], qIndex:0, correctCount:0, firstTry:true,
  journey:null, travelling:false,
  built:[],            // sentence builder progress
  selectedOnset:null,  // phonics bubble selection
  teaching:null,       // word-family teaching card payload
  feedback:null,       // 'right' | 'wrong'
  menuOpen:false, awardedTicket:false, lastTicket:null, soundMsg:null
};

/* ---------------- navigation ---------------- */
function goPicker(){
  state.screen='picker'; state.profileId=null; state.data=null;
  document.body.removeAttribute('data-theme'); render();
}
function selectProfile(pid){
  // This tap is a real user gesture, so speak here SYNCHRONOUSLY - it both
  // greets the child and is what unlocks audio for the rest of the session.
  unlockSpeech();
  state.profileId=pid; state.data=loadData(pid);
  speakQueue(['Hello '+CONFIG.profiles[pid].name+'! Let us play.'], 0);
  document.body.setAttribute('data-theme', CONFIG.profiles[pid].theme);
  state.screen='home'; render();
}
function goHome(){ state.screen='home'; state.menuOpen=false; render(); }
function openCategory(cat){ state.category=cat; state.screen='sets'; render(); }

function startRound(setIdx){
  if(!state.data){ goPicker(); return; }     // no profile loaded - go back safely
  state.setIndex=setIdx;
  state.questions=buildRound(state.category, setIdx);
  state.qIndex=0; state.correctCount=0; state.firstTry=true;
  state.built=[]; state.selectedOnset=null; state.teaching=null; state.feedback=null;
  state.journey=journeyFor(setIdx);
  state.screen='play'; state.travelling=false;
  render();
  setTimeout(()=>speakPrompt(), 500);
}

function currentQ(){ return state.questions[state.qIndex]; }

function speakPrompt(){
  const q=currentQ(); if(!q) return;
  if(q.type==='build')    speakSeq([sayGrapheme(q.onset), sayRime(q.rime), q.word], 700);
  else if(q.type==='listen') speak(q.word);
  else if(q.type==='sort')   speak('Which word is in the '+sayRime(q.rime)+' family?');
  else if(q.type==='begin')  speakSeq([q.word, 'Which sound does it start with?'], 900);
  else if(q.type==='end')    speakSeq([q.word, 'Which sound does it end with?'], 900);
  else if(q.type==='vowel')  speakSeq([q.word, 'Which vowel is in the middle?'], 900);
  else if(q.type==='blend')  speakSeq([q.word, q.label], 900);
  // Fill: never read the sentence before they answer — that would give it away.
  else if(q.type==='fill')   speak('Choose the missing word from one of the below.');
  else if(q.type==='sentence'){
    // Sets 1-10 model the sentence aloud first. Sets 11-20 do not — the child
    // must work it out, and only hears it read back once it is built.
    if(state.setIndex < 10) speak('Make the sentence: '+q.words.join(' '));
    else speak('Tap the words in the right order.');
  }
}

/* ---------------- answering ---------------- */
function answerChoice(value){
  const q=currentQ();
  let correct=false;
  if(q.type==='build')  correct = (value===q.onset);
  if(q.type==='listen'||q.type==='sort') correct = (value===q.word);
  if(q.type==='fill')   correct = (value===q.answer);
  if(q.type==='begin'||q.type==='end'||q.type==='vowel'||q.type==='blend') correct = (value===q.answer);

  if(correct){
    chime('success');
    if(state.firstTry) state.correctCount++;
    if(q.type==='build'){ state.selectedOnset=value; }
    state.feedback='right';
    render();
    setTimeout(()=>celebrateMoment(false), 60);
    if(q.type==='fill'){
      // read the WHOLE finished sentence, let it finish, then hold 2 seconds
      const full = q.sentence.replace('___', q.answer);
      setTimeout(()=>speakThen(full, 2000, ()=>travelToNext()), 250);
    } else {
      setTimeout(()=>speak(q.word), 200);
      setTimeout(()=>travelToNext(), 1300);
    }
  } else {
    chime('nudge');
    state.firstTry=false;
    state.feedback='wrong';
    // record the miss so the weekly dashboard can surface it later
    const key = q.word || q.answer;
    if(key) state.data.wrongWords[key]=(state.data.wrongWords[key]||0)+1;
    saveData();
    if(state.category==='phonics') showTeaching(q);
    else render();
  }
}

/* ---- word-family teaching card, shown when a phonics answer is wrong ---- */
function showTeaching(q){
  // --- sound sets: highlight the part they missed, show words that share it ---
  if(q.mode){
    const set = PHONICS_EXTRA[state.setIndex - WORD_FAMILIES.length];
    const heads = { begin:'Beginning Sounds', end:'Ending Sounds',
                    vowel:'Middle Vowels', blend:'Blends & Digraphs' };
    const same = set.words.filter(w=>{
      if(q.mode==='begin') return w.w[0]===q.answer;
      if(q.mode==='end')   return w.w.slice(-1)===q.answer;
      if(q.mode==='vowel') return w.w[1]===q.answer;
      return w.w.startsWith(q.answer);
    }).slice(0,5).map(w=>w.w);
    // sound it out piece by piece
    // Spoken as real phonemes / anchor words - never bare letters or fragments.
    let parts;
    if(q.mode==='vowel'){
      const anch = VOWEL_ANCHOR[q.answer] || q.word;
      parts = ['The middle sound in '+q.word+' is the same as in '+anch+'.', q.word];
    } else if(q.mode==='end'){
      parts = [q.word+' ends with '+sayGrapheme(q.answer)+'.', sayGrapheme(q.answer), q.word];
    } else {
      parts = [sayAnchored(q.answer, q.word), sayGrapheme(q.answer), q.word];
    }
    // on-screen bubbles still show the LETTERS; only the audio is phonemic
    const bubbles = q.mode==='vowel' ? [q.pre, q.answer, q.post].filter(p=>p!=='')
                  : q.mode==='end'   ? [q.pre, q.answer]
                  :                    [q.answer, q.post];
    state.teaching = { kind:'sound', head:heads[q.mode], word:q.word, icon:q.icon,
                       pre:q.pre, target:q.answer, post:q.post,
                       parts:bubbles, say:parts, related:same, note:q.label };
    render();
    setTimeout(()=>speakSeq(parts, 1100), 300);
    return;
  }
  // --- word families: the original family card ---
  const fam = WORD_FAMILIES.find(f=>f.rime===q.rime);
  const star = fam.words.find(w=>w.w===fam.star) || fam.words[0];
  const onset = q.word.slice(0, q.word.length-q.rime.length);
  state.teaching = { kind:'family', rime:q.rime, word:q.word, onset:onset, icon:q.icon,
                     example:star.w, exIcon:star.icon,
                     exOnset:star.w.slice(0,star.w.length-q.rime.length),
                     family: fam.words.slice(0,5).map(w=>w.w) };
  render();
  setTimeout(()=>speakSeq([sayAnchored(onset, q.word), sayGrapheme(onset), sayRime(q.rime), q.word], 800), 300);
}
function closeTeaching(){
  state.teaching=null; state.feedback=null; render();
  setTimeout(()=>speakPrompt(), 300);
}
function dismissWrong(){ state.feedback=null; render(); setTimeout(()=>speakPrompt(),250); }
const PRAISE_WORDS=['Yay!','Super!','Awesome!','Great job!','Brilliant!','Woohoo!','You did it!'];
function celebrateMoment(big){
  showPraise(big ? 'Hooray!' : PRAISE_WORDS[Math.floor(Math.random()*PRAISE_WORDS.length)]);
  launchConfetti(big ? 34 : 18);
}
function showPraise(text){
  const old=document.querySelector('.praiseBurst');
  if(old) old.remove();
  const el=document.createElement('div');
  el.className='praiseBurst';
  el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1250);
}
function launchConfetti(count){
  const layer=document.createElement('div');
  layer.className='confettiLayer';
  const colors=['#FFD84D','#FF7EB6','#7ACBFF','#8EE2A8','#C4A6FF','#FFA85C'];
  for(let i=0;i<count;i++){
    const p=document.createElement('span');
    p.className='confettiPiece';
    p.style.left=(Math.random()*100)+'vw';

/* ---- sentence builder ---- */
function tapWordTile(id){
  const q=currentQ();
  const tile=q.tiles.find(t=>t.id===id);
  const expected=q.words[state.built.length];
  if(tile.w===expected){
    chime('pop');
    state.built.push(id);
    if(state.built.length===q.words.length){
      chime('success');
      if(state.firstTry) state.correctCount++;
      state.feedback='right'; render();
      setTimeout(()=>celebrateMoment(false), 60);
      // read the finished sentence right through, then hold 2 seconds
      setTimeout(()=>speakThen(q.words.join(' '), 2000, ()=>travelToNext()), 250);
      return;
    }
    render();
  } else {
    chime('nudge'); state.firstTry=false;
    state.feedback='wrong'; render();
    setTimeout(()=>{ state.feedback=null; render(); }, 900);
  }
}
function undoTile(){ state.built.pop(); render(); }

/* ---------------- travel animation between questions ---------------- */
function travelToNext(){
  state.feedback=null; state.teaching=null;
  state.travelling=true;
  chime('travel');
  render();
  const j=state.journey;
  const nextStop=j.stops[Math.min(state.qIndex+1, j.stops.length-1)];
  setTimeout(()=>speak(j.kind==='train' ? 'Next stop, '+nextStop : 'Next we visit '+nextStop), 250);
  setTimeout(()=>{
    state.travelling=false;
    state.qIndex++;
    state.built=[]; state.selectedOnset=null; state.firstTry=true;
    if(state.qIndex>=state.questions.length){ finishRound(); return; }
    render();
    setTimeout(()=>speakPrompt(), 450);
  }, 2100);
}

/* ---------------- finish ---------------- */
function starsFor(score){ return score>=10?3 : score>=8?2 : score>=5?1 : 0; }

function finishRound(){
  const score=state.correctCount;
  const stars=starsFor(score);
  const key=resultKey(state.category,state.setIndex);
  const prev=state.data.results[key];
  state.data.results[key]={
    best: prev? Math.max(prev.best,score):score,
    stars: prev? Math.max(prev.stars,stars):stars,
    plays:(prev?prev.plays:0)+1, lastScore:score, last:todayStr()
  };
  state.data.totalStars += stars;

  const today=todayStr();
  if(state.data.lastPlayDate!==today){
    const y=addDays(today,-1), yy=addDays(today,-2);
    state.data.streak = (state.data.lastPlayDate===y||state.data.lastPlayDate===yy) ? state.data.streak+1 : 1;
    state.data.lastPlayDate=today;
  }
  // One Video Time Ticket for every 10 completed exercises. It is NOT handed
  // out here - it waits in My Progress > My badges for an adult to redeem.
  const before = ticketsEarned();
  state.data.roundsCompleted = (state.data.roundsCompleted||0)+1;
  state.awardedTicket = ticketsEarned() > before;
  saveData();
  state.screen='result'; chime('ticket'); render();
  setTimeout(()=>celebrateMoment(true), 100);
  // spoken congratulations, matched to how well they did
  const cheers = {
    3:['Congratulations! You got them all right. Well done!',
       'Wonderful! A perfect round. Congratulations!',
       'Amazing work! Every answer correct. Well done!'],
    2:['Well done! That was a great round.',
       'Congratulations! You did really well.',
       'Great job! You are getting so good at this.'],
    1:['Well done for finishing! You are getting better every time.',
       'Good work! Keep going, you are learning so much.'],
    0:['Well done for trying! Let us play that one again together.',
       'Good try! Every time you play, you get better.']
  };
  const line = pick(cheers[stars],1)[0];
  const name = currentProfile().name;
  setTimeout(()=>speak(name+'! '+line), 700);
}
/* One ticket per CONFIG.roundsPerTicket completed exercises. */
function ticketsEarned(){
  return Math.floor((state.data.roundsCompleted||0) / CONFIG.roundsPerTicket);
}
function ticketsPending(){
  return Math.max(0, ticketsEarned() - (state.data.ticketsRedeemed||0));
}
function roundsToNextTicket(){
  const r=(state.data.roundsCompleted||0) % CONFIG.roundsPerTicket;
  return CONFIG.roundsPerTicket - r;
}
/* Adult-only, and only from My Progress > My badges. */
function redeemTicket(){
  if(ticketsPending()<=0) return;
  state.data.ticketsRedeemed = (state.data.ticketsRedeemed||0)+1;
  state.data.ticketLog.push({date:todayStr(), redeemed:true});
  saveData(); chime('ticket'); render();
}
function replayRound(){ startRound(state.setIndex); }
function nextSet(){
  const n=Math.min(state.setIndex+1, setCount(state.category)-1);
  startRound(n);
}

/* ---------------- menu / export ---------------- */
function toggleMenu(v){ state.menuOpen=v; if(!v) state.soundMsg=null; render(); }
function exportData(){
  try{
  const payload={exportedAt:new Date().toISOString(), schemaVersion:CONFIG.schemaVersion,
    profiles:{ big:loadData('big'), little:loadData('little') }};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='word-explorer-progress-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert('Could not export on this browser.'); }
}
function importData(evt){
  const f=evt.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const p=JSON.parse(r.result);
      if(p.profiles){ Object.keys(p.profiles).forEach(pid=>rawSet(storageKey(pid), JSON.stringify(p.profiles[pid])));
        alert('Progress imported!');
        if(state.profileId) state.data=loadData(state.profileId);
        render(); }
    }catch(e){ alert('Could not read that file.'); } };
  r.readAsText(f);
}

/* =========================================================================
   RENDER
========================================================================= */
function render(){
  const app=document.getElementById('app');
  if(!app) return;
  // Every screen except the picker needs a loaded profile. A pending timer
  // (e.g. an audio callback) can fire after "Switch child", so guard here.
  if(state.screen!=='picker' && !state.data){ state.screen='picker'; state.menuOpen=false; }
  let h='';
  switch(state.screen){
    case 'picker': h=viewPicker(); break;
    case 'home':   h=viewHome(); break;
    case 'sets':   h=viewSets(); break;
    case 'play':   h=viewPlay(); break;
    case 'result': h=viewResult(); break;
    case 'progress': h=viewProgress(); break;
  }
  if(state.menuOpen) h+=viewMenu();
  app.innerHTML=h;

  // Make card-style controls keyboard accessible on desktop without changing
  // their existing click/touch behavior.
  app.querySelectorAll('.profileCard,.gameCard,.setCard,.pCell,.soundBanner').forEach(el=>{
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
    el.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); el.click(); }
    });
  });
}

/* ---------------- journey strip ---------------- */
function journeyStrip(){
  const j=state.journey || journeyFor(0);   // fallback if no round is active
  const pos=state.qIndex + (state.travelling?1:0);
  const pct=(pos/(j.stops.length-1))*100;
  const stopIcon = j.kind==='train' ? 'ic-mtr-station' : 'ic-castle-stop';
  let dots='';
  j.stops.forEach((s,i)=>{
    dots+='<div class="jStop'+(i<=pos?' reached':'')+'" style="left:'+((i/(j.stops.length-1))*100)+'%">'+
      '<div class="jDot" style="'+(i<=pos?'background:'+j.color+';':'')+'"></div></div>';
  });
  return '<div class="journeyWrap">'+
    '<div class="jHead"><span class="jLine" style="background:'+j.color+'"></span>'+
      '<span class="jName">'+j.name+'</span>'+
      '<span class="jNow">'+icon(stopIcon,'sm')+' '+j.stops[Math.min(pos,j.stops.length-1)]+'</span></div>'+
    '<div class="jTrack"><div class="jFill" style="width:'+pct+'%; background:'+j.color+'"></div>'+dots+
      '<div class="jMascot'+(state.travelling?' moving':'')+'" style="left:'+pct+'%">'+
        icon(currentProfile().mascot)+'</div></div></div>';

  let body='';

  else if(q.type==='sort')   body=viewSort(q);
  else if(q.type==='fill')   body=viewFill(q);
  else if(q.type==='sentence') body=viewSentence(q);

  const teach = state.teaching ? viewTeaching() : '';
  const hint = '<div class="kbdHint">Keyboard: press <b>1</b> <b>2</b> <b>3</b> to answer · '+
               '<b>Space</b> to hear it again</div>';
