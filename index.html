/* ---- beginning sound / ending sound / middle vowel / blend ----
   One shared view: the word is shown with the target part blanked out,
   and the choices are the letters (or blends) that could fill the gap. */
function viewSoundQ(q){
  const solved = state.feedback==='right';
  const gap = '<div class="slot onsetSlot'+(solved?' filled':'')+'">'+(solved?q.answer:'?')+'</div>';
  const pre  = q.pre  ? '<div class="slot fixedSlot">'+q.pre+'</div>' : '';
  const post = q.post ? '<div class="slot fixedSlot">'+q.post+'</div>' : '';
  const pic  = q.icon ? '<div class="picRound">'+icon(q.icon)+'</div>' : '';
  const opts = q.choices.map(c=>
    '<button class="bubble'+(solved&&c===q.answer?' chosen':'')+'" onclick="answerChoice(\''+c+'\')">'+c+'</button>'
  ).join('');
  return '<div class="qCard phonicsCard soundBuildCard">'+
    '<div class="qLabel">'+q.label+'</div>'+
    pic+
    '<div class="wordSlots">'+pre+gap+post+'</div>'+
    '<button class="speakBtn" onclick="speak(\''+q.word+'\')">'+icon('ic-speaker')+'</button>'+
    '<div class="bubbleRow">'+opts+'</div>'+
  '</div>';
}

/* ---- fill in the blank ---- */
function viewFill(q){
  const filled = state.feedback==='right';
  const parts=q.sentence.split('___');
  const gap = filled ? '<span class="gap filled">'+q.answer+'</span>' : '<span class="gap">?</span>';
  const opts=q.choices.map(c=>'<button class="wordCard'+(filled&&c===q.answer?' right':'')+
    '" onclick="answerChoice(\''+c+'\')">'+c+'</button>').join('');
  // Before answering, the speaker repeats the INSTRUCTION only — never the
  // sentence, which would hand the child the answer. After a correct answer it
  // reads the completed sentence.
  const speakTarget = filled ? q.sentence.replace('___', q.answer)
                             : 'Choose the missing word from one of the below.';
  return '<div class="qCard fillCard">'+
    '<div class="qLabel">Choose the missing word</div>'+
    '<div class="sentenceStrip">'+parts[0]+gap+(parts[1]||'')+'</div>'+
    '<button class="speakBtn" onclick="speak(&quot;'+speakTarget.replace(/"/g,'')+'&quot;)">'+icon('ic-speaker')+'</button>'+
    '<div class="cardRow">'+opts+'</div>'+
  '</div>';
}

/* ---- make a sentence ---- */
function viewSentence(q){
  const builtHtml=state.built.map(id=>{
    const t=q.tiles.find(x=>x.id===id);
    return '<span class="slotWord">'+t.w+'</span>';
  }).join('');
  const done=state.built.length===q.words.length;
  const blanks=q.words.map((w,i)=> i<state.built.length ? '' : '<span class="emptySlot"></span>').join('');
  const tiles=q.tiles.map(t=>{
    const used=state.built.indexOf(t.id)>=0;
    return '<button class="tile'+(used?' used':'')+'" onclick="tapWordTile('+t.id+')">'+t.w+'</button>';
  }).join('');
  return '<div class="qCard sentCard'+(state.feedback==='wrong'?' shake':'')+'">'+
    '<div class="qLabel">Tap the words in the right order</div>'+
    '<div class="buildStrip'+(done?' complete':'')+'">'+builtHtml+blanks+
      (done?'<span class="fullStop">.</span>':'')+'</div>'+
    '<div class="tileRow">'+tiles+'</div>'+
    (state.built.length&&!done ? '<button class="btn btn-secondary small" onclick="undoTile()">Undo</button>' : '')+
  '</div>';
}

/* ---- teaching card (wrong phonics answer) ---- */
function viewTeaching(){
  const t=state.teaching;
  if(t.kind==='sound') return viewTeachingSound(t);
  const famChips=t.family.map(w=>'<span class="famWord"><b>'+w.slice(0,w.length-t.rime.length)+'</b>'+t.rime+'</span>').join('');
  return '<div class="teachOverlay"><div class="teachCard">'+
    '<div class="teachHead">'+icon('ic-magnify','sm')+' Word Families</div>'+
    '<div class="teachRow">'+
      (t.exIcon? '<div class="picRound sm">'+icon(t.exIcon)+'</div>':'')+
      '<div class="teachWord"><span class="onsetC">'+t.exOnset+'</span><span class="rimeC">'+t.rime+'</span></div>'+
    '</div>'+
    '<div class="teachSub">-'+t.rime+' family</div>'+
    '<div class="teachBubbles">'+
      '<div class="tb">'+t.onset+'</div><div class="tbPlus">+</div><div class="tb">'+t.rime+'</div>'+
      '<div class="tbPlus">=</div><div class="tb whole">'+t.word+'</div>'+
    '</div>'+
    '<button class="speakBtn" onclick="speakSeq([\''+sayGrapheme(t.onset)+'\',\''+sayRime(t.rime)+'\',\''+t.word+'\'],800)">'+icon('ic-speaker')+'</button>'+
    '<div class="famRow">'+famChips+'</div>'+
    '<button class="btn btn-primary btn-wide" onclick="closeTeaching()">Got it — try again!</button>'+
  '</div></div>';
}

/* teaching card for beginning / ending / vowel / blend sets */
function viewTeachingSound(t){
  const chips=t.related.map(w=>'<span class="famWord">'+w+'</span>').join('');
  const bubbles=t.parts.map(p=>'<div class="tb'+(p===t.target?' target':'')+'">'+p+'</div>')
                       .join('<div class="tbPlus">+</div>');
  const say=JSON.stringify(t.say).replace(/"/g,"'");
  return '<div class="teachOverlay"><div class="teachCard">'+
    '<div class="teachHead">'+icon('ic-magnify','sm')+' '+t.head+'</div>'+
    '<div class="teachRow">'+
      (t.icon? '<div class="picRound sm">'+icon(t.icon)+'</div>':'')+
      '<div class="teachWord"><span class="onsetC">'+t.pre+'</span>'+
        '<span class="rimeC">'+t.target+'</span>'+
        '<span class="onsetC">'+t.post+'</span></div>'+
    '</div>'+
    '<div class="teachSub">'+t.note+'</div>'+
    '<div class="teachBubbles">'+bubbles+'<div class="tbPlus">=</div>'+
      '<div class="tb whole">'+t.word+'</div></div>'+
    '<button class="speakBtn" onclick="speakSeq('+say+',800)">'+icon('ic-speaker')+'</button>'+
    '<div class="teachSub sm">Other words like this</div>'+
    '<div class="famRow">'+chips+'</div>'+
    '<button class="btn btn-primary btn-wide" onclick="closeTeaching()">Got it — try again!</button>'+
  '</div></div>';
}

/* ---------------- result ---------------- */
function viewResult(){
  const score=state.correctCount, stars=starsFor(score);
  let s=''; for(let k=0;k<3;k++) s+=icon(k<stars?'ic-star':'ic-star-empty','lg');
  const j=state.journey || journeyFor(0);
  const nm = currentProfile().name;
  const msg = stars===3?'Perfect journey, '+nm+'!' : stars===2?'Great work, '+nm+'!'
            : stars===1?'Good try, '+nm+'!' : 'Let\'s try again, '+nm+'!';
  const cheerTitle = stars===3 ? 'Superstar reader!' : stars===2 ? 'You did amazing!' : stars===1 ? 'Nice job!' : 'Keep going!';
  const cheerText = stars===3 ? 'You zoomed through every question and picked up all the stars.'
    : stars===2 ? 'You answered lots of questions correctly and made awesome progress.'
    : stars===1 ? 'You finished the set and earned a star. Practice makes you stronger every time.'
    : 'You were brave and kept playing. Let\'s have another fun try!';
  return '<div class="screen center resultScreen">'+
    '<div class="mascotBig">'+icon(currentProfile().mascot)+'</div>'+
    '<h1>'+msg+'</h1>'+
    '<div class="starRow">'+s+'</div>'+
    '<div class="resultCelebrate"><h3>'+cheerTitle+'</h3><p>'+cheerText+'</p></div>'+
    '<div class="rewardPills">'+
      '<span class="rewardPill">'+icon('ic-star','sm')+' '+score+' / '+state.questions.length+' first-try correct</span>'+
      '<span class="rewardPill">🗺️ Finished '+j.name+'</span>'+
      '<span class="rewardPill">🏁 '+j.stops[0]+' → '+j.stops[j.stops.length-1]+'</span>'+
    '</div>'+
    (state.awardedTicket
       ? '<div class="ticketWon">'+icon('ic-ticket')+'<div><b>You earned a Video Time Ticket!</b><br>Go to My Progress and show it to an adult.</div></div>'
       : '<div class="ticketSoon">'+roundsToNextTicket()+' more '+(roundsToNextTicket()===1?'exercise':'exercises')+' to earn a Video Time Ticket</div>')+
    '<div class="btnRow"><button class="btn btn-secondary" onclick="replayRound()">Play again</button>'+
    '<button class="btn btn-secondary" onclick="nextSet()">Next set</button></div>'+
    '<button class="btn btn-secondary btn-wide" onclick="goHome()">Back to games</button>'+
  '</div>';
}

/* ---------------- progress: bright, encouraging, kid-facing ---------------- */
function viewProgress(){
  const p=currentProfile();
  let totalSets=0, doneSets=0, gotStars=0, maxStars=0;
  CATEGORIES.forEach(c=>{
    const n=setCount(c.id); totalSets+=n; maxStars+=n*3;
    for(let i=0;i<n;i++){ const r=getResult(c.id,i); if(r){ doneSets++; gotStars+=r.stars; } }
  });
  const pct = totalSets? Math.round((doneSets/totalSets)*100) : 0;

  // encouragement that grows with progress
  const cheer = doneSets===0 ? 'Ready for your first adventure!'
    : pct<15  ? "Great start! You are on your way!"
    : pct<35  ? "Look how far you have come!"
    : pct<60  ? "You are doing brilliantly! Keep going!"
    : pct<85  ? "Wow! Nearly there — you are a superstar!"
    : pct<100 ? "Almost every set done. Amazing work!"
    :           "You finished EVERYTHING! Champion!";

  const blocks=CATEGORIES.map(c=>{
    const n=setCount(c.id);
    let cells='', done=0, stars=0;
    for(let i=0;i<n;i++){
      const r=getResult(c.id,i); if(r){ done++; stars+=r.stars; }
      const sec=sectionFor(c.id,i);
      if(sec) cells+='<div class="pSection">'+sec+'</div>';
      const st=r?r.stars:0;
      cells+='<div class="pCell s'+st+'" title="'+setTitle(c.id,i)+'" '+
        'onclick="state.category=\''+c.id+'\';startRound('+i+')">'+
        '<span class="pNum">'+(i+1)+'</span>'+
        (st? '<span class="pStars">'+'★'.repeat(st)+'</span>' : '')+
        '</div>';
    }
    const cpct = Math.round((done/n)*100);
    return '<div class="pBlock">'+
      '<div class="pHead"><div class="pTitle">'+c.en+'</div>'+
      '<div class="pCount">'+done+' / '+n+'</div></div>'+
      '<div class="pBar"><div class="pBarFill" style="width:'+cpct+'%"></div>'+
        '<div class="pBarMascot" style="left:'+cpct+'%">'+icon(p.mascot)+'</div></div>'+
      '<div class="pGrid">'+cells+'</div></div>';
  }).join('');

  // badges unlock as they go — visible goals to aim at
  const badges=[
    {n:'First set',  ok:doneSets>=1},   {n:'5 sets',   ok:doneSets>=5},
    {n:'10 sets',    ok:doneSets>=10},  {n:'25 sets',  ok:doneSets>=25},
    {n:'50 stars',   ok:gotStars>=50},  {n:'100 stars',ok:gotStars>=100},
    {n:'3 day streak',ok:state.data.streak>=3}, {n:'5 day streak',ok:state.data.streak>=5}
  ].map(b=>'<div class="badge'+(b.ok?' on':'')+'">'+icon(b.ok?'ic-trophy':'ic-lock')+
      '<div class="bLbl">'+b.n+'</div></div>').join('');

  const weak=Object.entries(state.data.wrongWords).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const weakHtml = weak.length ? weak.map(w=>'<span class="weakChip">'+w[0]+'</span>').join('')
    : '<span class="sub">Nothing tricky yet — keep playing!</span>';

  return topBar('My Progress','goHome()')+
    '<div class="screen progressScreen">'+
      '<div class="cheerCard">'+
        '<div class="cheerMascot">'+icon(p.mascot)+'</div>'+
        '<div class="cheerText"><div class="cheerBig">'+cheer+'</div>'+
        '<div class="cheerStats">'+
          '<span class="statPill">'+icon('ic-star','sm')+' '+gotStars+' stars</span>'+
          '<span class="statPill">'+doneSets+' / '+totalSets+' sets</span>'+
          '<span class="statPill">'+state.data.streak+' day streak</span>'+
        '</div></div>'+
      '</div>'+
      '<div class="bigBar"><div class="bigBarFill" style="width:'+pct+'%"><span>'+pct+'%</span></div></div>'+
      blocks+
      '<div class="pBlock"><div class="pTitle">My badges</div><div class="badgeRow">'+badges+'</div>'+
        ticketCardHtml()+
      '</div>'+
      '<div class="pBlock"><div class="pTitle">Words to practise</div><div class="weakRow">'+weakHtml+'</div></div>'+
      '<p class="sub center-text">Tap any number to play that set again.</p>'+
    '</div>';
}

/* Voices differ on every device, so let the adult pick the clearest one. */
function voicePickerHtml(){
  if(!('speechSynthesis' in window)) return '';
  const en=allVoices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));
  const list=[];
  PREFERRED_VOICES.forEach(name=>{
    const v=en.find(x=>x.name===name) || en.find(x=>x.name.indexOf(name)>=0);
    if(v && !list.some(x=>x.name===v.name)) list.push(v);
  });
  if(!list.length){
    return '<div class="voicePick"><label>Reading voice</label>'+
      '<div class="sub">Using this device\'s default English voice.</div></div>';
  }
  const opts=list.map(v=>'<option value="'+v.name.replace(/"/g,'')+'"'+
      (englishVoice&&englishVoice.name===v.name?' selected':'')+'>'+
      (VOICE_LABELS[v.name]||v.name+' ('+v.lang+')')+'</option>').join('');
  return '<div class="voicePick"><label>Reading voice</label>'+
    '<select onchange="setVoice(this.value)">'+opts+'</select>'+
    '<div class="sub">Pick one to hear it read a sample.</div></div>';
}

/* Video Time Tickets live here and NOWHERE else - one per 10 exercises,
   redeemed by an adult from My Progress > My badges. */
function ticketCardHtml(){
  const pending=ticketsPending();
  const done=(state.data.roundsCompleted||0);
  const inCycle=done % CONFIG.roundsPerTicket;
  const pct=Math.round((inCycle/CONFIG.roundsPerTicket)*100);
  const p=currentProfile();

  if(pending>0){
    return '<div class="ticketCard live">'+
      '<div class="ticketArt">'+icon('ic-ticket')+'</div>'+
      '<h2>Video Time Ticket'+(pending>1?' x'+pending:'')+'</h2>'+
      '<div class="ticketBig">'+CONFIG.ticketMinutes+' minutes</div>'+
      '<div>of YouTube time</div>'+
      '<div class="showTo"><b>Show this to Grandma or your helper</b></div>'+
      '<div class="redeemBox">'+
        '<div><b>'+p.name+'</b></div>'+
        '<div>Date: '+todayStr()+'</div>'+
        '<div>Earned after '+done+' exercises</div>'+
        '<p class="adultNote">Adult: tap below once the video time has been '+
          'given, so the ticket cannot be used twice.</p>'+
        '<button class="btn btn-success btn-wide" onclick="redeemTicket()">Redeemed</button>'+
      '</div></div>';
  }
  return '<div class="ticketCard locked">'+
    '<div class="ticketArtDim">'+icon('ic-ticket')+'</div>'+
    '<div class="lockedTitle">Next Video Time Ticket</div>'+
    '<div class="ticketBar"><div class="ticketBarFill" style="width:'+pct+'%"></div></div>'+
    '<div class="lockedSub">'+inCycle+' of '+CONFIG.roundsPerTicket+' exercises done - '+
      roundsToNextTicket()+' more to go!</div>'+
  '</div>';
}

function viewMenu(){
  return '<div class="menuOverlay" onclick="if(event.target===this) toggleMenu(false)"><div class="menuSheet"><div class="sheetHandle"></div>'+
    '<h2>Menu</h2>'+
    (state.profileId? '<button class="btn btn-secondary btn-wide" onclick="toggleMenu(false);state.screen=\'progress\';render()">My progress</button>':'')+
    '<button class="btn btn-secondary btn-wide" onclick="exportData()">Export progress (backup)</button>'+
    '<label class="btn btn-secondary btn-wide">Import progress<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label>'+
    '<button class="btn btn-secondary btn-wide" onclick="enableSound()">Test sound</button>'+
    (state.soundMsg? '<div class="soundMsg">'+state.soundMsg+'</div>' : '')+
    voicePickerHtml()+
    '<button class="btn btn-secondary btn-wide" onclick="goPicker();toggleMenu(false)">Switch child</button>'+
    '<button class="btn btn-primary btn-wide" onclick="toggleMenu(false)">Close</button>'+
  '</div></div>';
}

/* ---------------- init ---------------- */
/* ---- desktop keyboard control ---------------------------------------------
   1-9 pick an answer, Space replays the audio, Enter presses the main button,
   Escape closes an overlay. Mouse/touch continue to work unchanged.        */
function answerKeys(){
  return Array.prototype.slice.call(
    document.querySelectorAll('.bubble, .wordBtn, .wordCard, .tile:not(.used), .choiceBtn'));
}
function handleKey(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  unlockSpeech();
  if(e.key==='Escape'){
    if(state.teaching) closeTeaching();
    else if(state.menuOpen) toggleMenu(false);
    return;
  }
  if(e.key===' '){                       // replay the audio
    const sp=document.querySelector('.speakBtn');
    if(sp){ sp.click(); e.preventDefault(); }
    return;
  }
  if(e.key==='Enter'){
    const b=document.querySelector('.teachCard .btn-primary')||document.querySelector('.btn-primary');
    if(b){ b.click(); e.preventDefault(); }
    return;
  }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){
    const list=answerKeys();
    if(list[n-1]){ list[n-1].click(); e.preventDefault(); }
  }
}

function init(){
  initVoices();
  document.addEventListener('keydown', handleKey);
  // iOS blocks speech until it has been started once from a real user gesture,
  // so unlock on the very first tap anywhere and also resume the chime context.
  const firstTouch=()=>{
    unlockSpeech();
    try{ if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
  };
  document.addEventListener('touchstart', firstTouch, true);
  document.addEventListener('mousedown', firstTouch, true);
  document.addEventListener('keydown', firstTouch, true);
  render();
}
window.addEventListener('DOMContentLoaded', init);

</script>
